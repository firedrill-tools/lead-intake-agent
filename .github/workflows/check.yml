name: Check
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - run: uv sync --dev --locked
      - run: uv run --no-sync pytest -q
      - run: uv run --no-sync lead-intake --help
      - run: uv run --no-sync lead-intake --list-cases
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --prefix firedrill --ignore-scripts --no-audit --no-fund
      - run: npm test --prefix firedrill
      - run: uv build
      - run: uv run --no-sync python scripts/check_wheel.py
