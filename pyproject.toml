[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lead-intake-agent"
version = "0.1.0"
description = "Gemini-backed lead intake webhook with a Pipedream Connect action boundary"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["google-genai==2.31.0", "pipedream==2.1.20", "fastapi==0.143.2", "uvicorn==0.54.0", "pydantic[email]>=2.12,<3", "httpx==0.28.1"]

[project.scripts]
lead-intake = "lead_intake.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "httpx2==2.13.1"]

[tool.hatch.build.targets.wheel]
packages = ["src/lead_intake"]

[tool.hatch.build.targets.wheel.force-include]
"fixtures" = "lead_intake/sample_data"

[tool.pytest.ini_options]
testpaths = ["tests"]
